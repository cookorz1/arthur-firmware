name: Build CookWrt for JDCloud AX1800 Pro
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: '构建成功后发布 VERSION 对应的 GitHub Release（已有版本不覆盖）'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'config.seed'
      - 'versions.env'
      - 'build.sh'
      - 'files/**'
      - 'package/**'
      - 'tests/**'
      - 'scripts/**'
      - 'required-packages.txt'
      - 'feeds.lock.json'
      - 'VERSION'
      - 'CHANGELOG.md'
      - 'docs/**'
permissions:
  contents: read
concurrency:
  group: arthur-firmware-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      BUILD_JOBS: '2'
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact: ${{ steps.version.outputs.artifact }}
    steps:
      - uses: actions/checkout@v7
      - name: Check version and changelog
        id: version
        run: |
          version=$(python3 scripts/firmware_release.py check .)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "artifact=jdy-cookorz-v$version-${GITHUB_SHA:0:12}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          printf '## jdy-cookorz v%s · by-cookorz\n\n- Source: `%s`\n- Release publication requested: `%s`\n' "$version" "$GITHUB_SHA" "$PUBLISH_RELEASE" >> "$GITHUB_STEP_SUMMARY"
        env:
          PUBLISH_RELEASE: ${{ github.event_name == 'push' || inputs.publish_release || false }}
      - name: Test network panel and persistent USB control
        run: |
          bash -n build.sh
          find files package/arthur/files -type f \( -path '*/etc/init.d/*' -o -path '*/etc/hotplug.d/*' -o -path '*/etc/uci-defaults/*' -o -path '*/usr/libexec/*' \) -print0 | xargs -0 -r -n1 sh -n
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          node tests/test_view.cjs
          node tests/test_performance_view.cjs
          node tests/test_dashboard_view.cjs
      - name: Render and verify dashboard and login
        shell: bash
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/arthur-ui" playwright@1.56.1
          "$RUNNER_TEMP/arthur-ui/node_modules/.bin/playwright" install --with-deps chromium
          luci_ref=$(python3 -c 'import json; print(json.load(open("feeds.lock.json"))["luci"])')
          curl -fL --retry 3 "https://raw.githubusercontent.com/immortalwrt/luci/$luci_ref/themes/luci-theme-argon/htdocs/luci-static/argon/css/cascade.css" -o "$RUNNER_TEMP/argon.css"
          python3 scripts/preview_theme.py "$RUNNER_TEMP/argon.css"
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/arthur-ui/node_modules/playwright" node tests/render_theme.cjs
      - name: Upload interface previews
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Arthur-interface-previews-${{ github.run_number }}
          path: logs/ui/
          if-no-files-found: ignore
          retention-days: 14
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools python3-pyelftools rsync swig unzip zlib1g-dev file wget curl zstd cpio libelf-dev libfuse-dev libglib2.0-dev libgmp-dev libmpc-dev libmpfr-dev libtool autoconf automake autopoint gperf help2man texinfo device-tree-compiler patch subversion
          df -h .
      - name: Prepare source and verify required packages
        shell: bash
        run: PREPARE_ONLY=1 bash build.sh
      - name: Compile firmware
        if: success()
        shell: bash
        run: BUILD_ONLY=1 bash build.sh
      - name: Upload compiled firmware
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: output/
          if-no-files-found: error
          retention-days: 30
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Arthur-build-logs-${{ github.run_number }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 14
  publish:
    name: Publish versioned release
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish_release)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: output/
      - name: Verify assets and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          SKIP_EXISTING_RELEASE: ${{ github.event_name == 'push' && '1' || '0' }}
        run: python3 scripts/publish_release.py output
