name: Build Arthur F50 OpenClash iStore
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'config.seed'
      - 'versions.env'
      - 'build.sh'
      - 'files/**'
permissions:
  contents: read
concurrency:
  group: arthur-firmware-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools python3-pyelftools rsync swig unzip zlib1g-dev file wget curl zstd cpio libelf-dev libfuse-dev libglib2.0-dev libgmp-dev libmpc-dev libmpfr-dev libtool autoconf automake autopoint gperf help2man texinfo device-tree-compiler patch subversion
          df -h .
      - name: Prepare source and verify required packages
        shell: bash
        run: PREPARE_ONLY=1 bash build.sh
      - name: Compile firmware
        shell: bash
        run: BUILD_ONLY=1 bash build.sh
      - name: Upload compiled firmware
        uses: actions/upload-artifact@v4
        with:
          name: Arthur-F50-OpenClash-iStore-${{ github.run_number }}
          path: output/
          if-no-files-found: error
          retention-days: 30
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Arthur-build-logs-${{ github.run_number }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 14
